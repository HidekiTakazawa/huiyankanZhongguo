<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>慧眼看中国アプリ紹介</title>

    <!-- PWA対応: manifest.json のリンク -->
    <link rel="manifest" href="manifest.json">

    <!-- PWA対応: テーマカラー -->
    <meta name="theme-color" content="#333333">

    <!-- PWA対応: iOS向け設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="慧眼看中国アプリ紹介">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>アプリ一覧(6種)</h1>
    </header>

    <main id="app-list-container">
        <!-- アプリ紹介セクションはここにJavaScriptで動的に生成されます -->
    </main>

    <footer>
        <p>このアプリは慧眼看中国アプリ作成者が運営しています。</p>
    </footer>
    <!-- ★追加: 更新通知用のUI -->
    <div id="update-notification" class="update-notification">
        新しいバージョンが利用可能です。
        <button id="update-button">更新</button>
    </div>
    <!-- ★追加: インストールボタン（初期状態は非表示） -->
    <button id="install-button"
        style="display: none; position: fixed; bottom: 80px; right: 20px; z-index: 1000; padding: 12px 24px; background-color: #007bff; color: white; border: none; border-radius: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; font-weight: bold;">
        アプリをインストール
    </button>
    <!-- ★追加: iPhone / iPad (iOS) 向け自動インストール案内バナー -->
    <div id="ios-install-banner" class="ios-install-banner" role="dialog" aria-labelledby="ios-install-title">
        <div class="ios-install-header">
            <div class="ios-install-title-group">
                <img src="icons/icon-192x192.png" alt="アプリアイコン" class="ios-install-icon">
                <p id="ios-install-title" class="ios-install-title">アプリをインストール</p>
            </div>
            <button id="ios-install-close" class="ios-install-close" aria-label="閉じる">&times;</button>
        </div>
        <ol class="ios-install-steps">
            <li>
                画面下の共有ボタン
                <span class="ios-share-icon" aria-hidden="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                        <polyline points="16 6 12 2 8 6"></polyline>
                        <line x1="12" y1="2" x2="12" y2="15"></line>
                    </svg>
                </span>
                をタップ
            </li>
            <li>メニューから<strong>「ホーム画面に追加」</strong>を選択</li>
        </ol>
    </div>
    <!-- サービスワーカーの登録スクリプト -->
    <script>
        if ('serviceWorker' in navigator) {
            const showUpdateNotification = (registration) => {
                const notification = document.getElementById('update-notification');
                const updateButton = document.getElementById('update-button');

                const newUpdateButton = updateButton.cloneNode(true);
                updateButton.parentNode.replaceChild(newUpdateButton, updateButton);

                newUpdateButton.addEventListener('click', () => {
                    const waitingWorker = registration.waiting;
                    if (waitingWorker) {
                        // 更新の意思表示としてメッセージを送信
                        waitingWorker.postMessage({ action: 'skipWaiting' });
                    } else {
                        window.location.reload();
                    }
                });
                notification.style.display = 'block';
            };

            // インストール中のService Workerの状態変化を監視する関数
            const trackInstalling = (worker, registration) => {
                if (!worker) return;
                worker.addEventListener('statechange', () => {
                    // 待機状態になったら更新UIを表示
                    if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                        showUpdateNotification(registration);
                    }
                });
            };

            const registerSW = async () => {
                try {
                    const registration = await navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' });

                    // 1. すでに待機中のSWがいる場合
                    if (registration.waiting) {
                        showUpdateNotification(registration);
                    }

                    // 2. ページ読み込み中にすでにインストールが始まっているSWがいる場合（スマホでの取りこぼし防止）
                    if (registration.installing) {
                        trackInstalling(registration.installing, registration);
                    }

                    // 3. 新しいSWのインストールが検知された場合
                    registration.addEventListener('updatefound', () => {
                        trackInstalling(registration.installing, registration);
                    });

                    // 初回登録時にもサーバーへ最新版の有無を明示的に確認
                    registration.update().catch(() => { });

                    // ★重要: スマホ（Android/iPhone）でホーム画面やバックグラウンドからアプリに戻った時に更新をチェック
                    document.addEventListener('visibilitychange', () => {
                        if (document.visibilityState === 'visible') {
                            registration.update().then(() => {
                                if (registration.waiting) {
                                    showUpdateNotification(registration);
                                }
                            }).catch(() => { });
                        }
                    });

                    window.addEventListener('pageshow', () => {
                        registration.update().then(() => {
                            if (registration.waiting) {
                                showUpdateNotification(registration);
                            }
                        }).catch(() => { });
                    });

                } catch (error) {
                    console.error('Service Worker registration failed:', error);
                }
            };

            // サービスワーカーが切り替わったことを検知してリロードする
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return;
                console.log('Controller changed. Forcing reload.');
                refreshing = true;
                window.location.reload();
            });

            // ページ読み込みを待たずに即座にSW監視を開始（スマホで画像読み込み中にupdatefoundを取りこぼすのを防ぐ）
            registerSW();

            // ★★★ 追加: インストールプロンプトの制御 ★★★
            let deferredPrompt;
            const installButton = document.getElementById('install-button');
            const iosInstallBanner = document.getElementById('ios-install-banner');
            const iosInstallClose = document.getElementById('ios-install-close');

            // iOS端末（iPhone / iPad / iPod）かどうかの判定
            const isIos = () => {
                const userAgent = window.navigator.userAgent.toLowerCase();
                return /iphone|ipad|ipod/.test(userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            };

            // すでにPWAとしてインストール済み（スタンドアロン起動）かどうかの判定
            const isInStandaloneMode = () => {
                return ('standalone' in window.navigator && window.navigator.standalone) ||
                    window.matchMedia('(display-mode: standalone)').matches;
            };

            // iPhone / iPad で未インストールの場合は自動でインストール案内バナーを表示
            if (isIos() && !isInStandaloneMode()) {
                window.addEventListener('load', () => {
                    iosInstallBanner.style.display = 'block';
                    installButton.style.display = 'block';
                });

                iosInstallClose.addEventListener('click', () => {
                    iosInstallBanner.style.display = 'none';
                });
            }

            // ブラウザが「インストール可能」と判定した時に発生するイベント（Windows / Android向け）
            window.addEventListener('beforeinstallprompt', (e) => {
                // ブラウザ標準のインストールプロンプト（アドレスバーの表示など）を一旦キャンセル
                e.preventDefault();
                // イベントを保持しておく（後でボタンを押した時に使うため）
                deferredPrompt = e;
                // インストールボタンを表示
                installButton.style.display = 'block';
            });

            installButton.addEventListener('click', async () => {
                // iOSの場合は案内バナーを再表示
                if (isIos() && !isInStandaloneMode()) {
                    iosInstallBanner.style.display = 'block';
                    return;
                }
                if (!deferredPrompt) return;
                // 保持しておいたプロンプトを表示
                deferredPrompt.prompt();
                // ユーザーの応答（インストールする/しない）を待機
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response to the install prompt: ${outcome}`);
                // プロンプトは一度しか使えないため破棄
                deferredPrompt = null;
                // ボタンを非表示にする
                installButton.style.display = 'none';
            });

            window.addEventListener('appinstalled', () => {
                installButton.style.display = 'none';
                deferredPrompt = null;
                console.log('PWA was installed');
            });
        }
    </script>
    <script src="script.js"></script>
</body>

</html>
